name: Documentation

on:
  push:
    branches: [master]
    paths: ['docs/**', 'site/**', '.github/workflows/pages.yml']
  pull_request:
    paths: ['docs/**', 'site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  HUGO_VERSION: '0.167.0'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Hugo
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSL -O "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl -fsSL -O "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing "hugo_${HUGO_VERSION}_checksums.txt"
          tar -xzf "hugo_${HUGO_VERSION}_linux-amd64.tar.gz" hugo
          echo "${RUNNER_TEMP}" >> "$GITHUB_PATH"
      - name: Build documentation
        run: hugo --source site --minify --panicOnWarning
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/public

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
