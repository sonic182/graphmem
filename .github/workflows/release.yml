name: Release

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate release version
        id: version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | python -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "graphmem"))')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            [[ "$GITHUB_REF_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && "$GITHUB_REF_NAME" == "$version" ]] || {
              echo "Tag $GITHUB_REF_NAME must match Cargo.toml version $version" >&2
              exit 1
            }
          fi
      - run: cargo build --release --locked
      - name: Package and smoke-test archive
        run: |
          name="gmem-${{ steps.version.outputs.version }}-${{ matrix.target }}"
          mkdir -p dist unpack
          if [[ "$RUNNER_OS" == Windows ]]; then
            ./target/release/gmem.exe --help
            (cd target/release && 7z a "../../dist/$name.zip" gmem.exe)
            7z x "dist/$name.zip" -ounpack
            ./unpack/gmem.exe --help
          else
            ./target/release/gmem --help
            tar -czf "dist/$name.tar.gz" -C target/release gmem
            tar -xzf "dist/$name.tar.gz" -C unpack
            ./unpack/gmem --help
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: gmem-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: gmem-*
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum gmem-* > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" ./* --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes --draft
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
