name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
      - run: cargo nextest run --workspace --locked --features code --no-fail-fast --no-tests=pass

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: taiki-e/install-action@nextest
      # Caches the dependency build (target/ + registry) keyed on Cargo.lock and
      # the toolchain, so pulls only rebuild what changed instead of all ~400 crates.
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets --message-format=short
      # Not --all-features: the cuda feature only switches candle to cudarc,
      # whose build script needs nvcc, and gates no code of ours to lint.
      - run: cargo clippy --workspace --all-targets --features code --message-format=short -- -D warnings
      - run: cargo nextest run --workspace --features code --no-fail-fast --no-tests=pass
      - run: cargo test --lib granite_modernbert_batch_matches_single_and_crosses_languages -- --ignored
