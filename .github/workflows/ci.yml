name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: taiki-e/install-action@nextest
      # Caches the dependency build (target/ + registry) keyed on Cargo.lock and
      # the toolchain, so pulls only rebuild what changed instead of all ~400 crates.
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets --message-format=short
      # Not --all-features: the cuda feature only switches candle to cudarc,
      # whose build script needs nvcc, and gates no code of ours to lint.
      - run: cargo clippy --workspace --all-targets --message-format=short -- -D warnings
      - run: cargo nextest run --workspace --no-fail-fast --no-tests=pass
