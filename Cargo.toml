[package]
name = "graphmem"
version = "0.7.1"
edition = "2024"
license = "MIT"
autobins = false

[features]
default = []
cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]
code = [
    "dep:ast-grep-core",
    "dep:ast-grep-language",
    "dep:ast-grep-outline",
    "dep:tree-sitter-heex",
    "dep:tree-sitter-scss",
    "dep:tree-sitter-scss-windows",
    "dep:tree-sitter-sequel",
    "dep:tree-sitter-zig",
    "dep:rayon",
]

[[bin]]
name = "gmem"
path = "src/main.rs"

[dependencies]
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"
clap = { version = "4", features = ["derive"] }
directories = "6"
hf-hub = { version = "1", features = ["blocking"] }
rmcp = { version = "3", features = ["transport-io"] }
rusqlite = { version = "0.40", features = ["bundled"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tokenizers = "0.23"
toml = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
ratatui = "0.30.2"
pulldown-cmark = "0.13"
ast-grep-core = { version = "0.45.3", optional = true }
ast-grep-outline = { version = "0.45.3", optional = true }
tree-sitter-heex = { version = "0.8.1", optional = true }
tree-sitter-sequel = { version = "0.3.11", optional = true }
tree-sitter-zig = { version = "1.1.2", optional = true }
rayon = { version = "1.12", optional = true }
ast-grep-language = { version = "0.45.3", default-features = false, features = [
    "tree-sitter-bash",
    "tree-sitter-c",
    "tree-sitter-cpp",
    "tree-sitter-css",
    "tree-sitter-elixir",
    "tree-sitter-go",
    "tree-sitter-html",
    "tree-sitter-javascript",
    "tree-sitter-typescript",
    "tree-sitter-python",
    "tree-sitter-ruby",
    "tree-sitter-php",
    "tree-sitter-rust",
], optional = true }

[target.'cfg(not(windows))'.dependencies]
tree-sitter-scss = { version = "1.0.0", optional = true }

[target.'cfg(windows)'.dependencies]
tree-sitter-scss-windows = { package = "tree-sitter-scss", git = "https://github.com/tree-sitter-grammars/tree-sitter-scss", rev = "9ab738d22bb248771d42e8678d1a307d14990df1", optional = true }
