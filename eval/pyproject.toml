[project]
name = "gmem-eval"
version = "0.1.0"
description = "Minimal Strands agent benchmark for the gmem code tools"
requires-python = ">=3.12"
dependencies = [
    "strands-agents",
    "litellm",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
# PEP 8: E/W are pycodestyle, N is pep8-naming. The rest are the usual
# correctness and import-order rules that keep the harness readable.
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"harness.py" = ["E402"]
